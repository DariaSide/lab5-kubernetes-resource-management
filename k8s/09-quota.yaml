apiVersion: v1
kind: Namespace
metadata:
  name: lab5-quota
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: lab5-quota
spec:
  hard:
    pods: "2"
    requests.cpu: 500m
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 512Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: quota-first
  namespace: lab5-quota
spec:
  restartPolicy: Never
  containers:
    - name: first
      image: skill-pairs:lab5
      imagePullPolicy: Never
      args: ["burn-cpu"]
      env:
        - {name: DURATION_SECONDS, value: "300"}
      resources:
        requests: {cpu: 400m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: quota-rejected
  namespace: lab5-quota
spec:
  restartPolicy: Never
  containers:
    - name: rejected
      image: skill-pairs:lab5
      imagePullPolicy: Never
      args: ["burn-cpu"]
      env:
        - {name: DURATION_SECONDS, value: "300"}
      resources:
        requests: {cpu: 200m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}

