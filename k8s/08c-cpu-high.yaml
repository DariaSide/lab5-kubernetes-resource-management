apiVersion: v1
kind: Pod
metadata:
  name: cpu-high
  namespace: lab5
  labels: {app: cpu-high}
spec:
  priorityClassName: lab5-high
  terminationGracePeriodSeconds: 0
  containers:
    - name: burner
      image: skill-pairs:lab5
      imagePullPolicy: Never
      args: ["burn-cpu"]
      env:
        - {name: DURATION_SECONDS, value: "120"}
      resources:
        requests: {cpu: "2", memory: 32Mi}
        limits: {cpu: "2", memory: 64Mi}

