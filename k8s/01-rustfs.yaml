apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: lab5
spec:
  selector:
    app: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: lab5
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      initContainers:
        - name: prepare-disks
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /data/disk1 /data/disk2 /data/disk3 /data/disk4 && chown -R 10001:10001 /data"]
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          imagePullPolicy: IfNotPresent
          args: ["/data/disk1", "/data/disk2", "/data/disk3", "/data/disk4"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: secret-key}}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "true"}
            - {name: RUSTFS_CONSOLE_ADDRESS, value: ":9001"}
            - {name: RUSTFS_OBS_LOGGER_LEVEL, value: "error"}
            - {name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK, value: "true"}
          ports:
            - {name: s3, containerPort: 9000}
            - {name: console, containerPort: 9001}
          readinessProbe:
            httpGet: {path: /health, port: s3}
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
